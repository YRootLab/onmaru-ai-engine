name: AI Engine CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-engine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/yrootlab/onmaru-ai-engine/ai-engine

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups
      - name: Test and static analysis
        run: |
          uv run pytest
          uv run ruff check src tests scripts
          uv run mypy
          bash scripts/test/run-ai-evals.test.sh
      - name: Evaluate held-out baseline
        run: |
          uv run python scripts/run-ai-evals \
            --input evals/journey-held-out-v1.json \
            --output "$RUNNER_TEMP/ai-eval-report.json" \
            --schema-output "$RUNNER_TEMP/ai-eval-report.schema.json"
          cmp evals/report.schema.json "$RUNNER_TEMP/ai-eval-report.schema.json"
      - name: Build container image
        run: docker build --tag onmaru-ai-engine:${{ github.sha }} .

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish immutable source tag
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=ai-engine
          cache-to: type=gha,mode=max,scope=ai-engine
      - name: Scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.image.outputs.digest }}
          format: sarif
          output: trivy-ai-engine.sarif
          scanners: vuln
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: "1"
      - name: Upload image scan
        if: always() && hashFiles('trivy-ai-engine.sarif') != ''
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: trivy-ai-engine.sarif
          category: ai-engine-image
